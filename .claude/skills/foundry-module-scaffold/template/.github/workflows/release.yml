# On a published GitHub release tagged vX.Y.Z: stamp the version and URLs into module.json,
# zip the module, and attach module.json + module.zip to the release.
name: Release
on:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stamp manifest
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          REPO="${GITHUB_REPOSITORY}"
          jq --arg v "$VERSION" --arg r "$REPO" --arg t "$GITHUB_REF_NAME" '
            .version = $v |
            .manifest = "https://github.com/\($r)/releases/latest/download/module.json" |
            .download = "https://github.com/\($r)/releases/download/\($t)/module.zip"
          ' module.json > module.tmp && mv module.tmp module.json
      - name: Zip module
        run: zip -r module.zip module.json scripts styles templates lang packs $(ls README.md LICENSE CHANGELOG.md 2>/dev/null) -x "*.gitkeep"
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" module.json module.zip --clobber
